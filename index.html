<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yarn Heist 🧶</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🧶 YARN HEIST</h1>

    <p class="subtitle">
        Help her steal the yarn without getting caught! 😂
    </p>

    <div class="hud">
        <span>🧶 Yarn: <b id="score">0</b></span>
        <span>❤️ Lives: <b id="lives">3</b></span>
        <span>🔥 Level: <b id="level">1</b></span>
    </div>

    <div id="game">

        <!-- YOUR ORIGINAL IMAGE — NOT CROPPED -->
        <div id="player">
            <img src="img2.jpg" alt="Crochet cat">
        </div>

        <div id="message">

            <h2>🧶 YARN HEIST</h2>

            <p>
                Move with ← → or A / D
            </p>

            <p>
                Catch 🧶 &nbsp; | &nbsp; Avoid ✂️
            </p>

            <button id="startBtn">
                STEAL THE YARN
            </button>

        </div>

    </div>

    <p class="hint">
        Don't let the scissors ruin her yarn addiction 💀
    </p>

    <script src="script.js"></script>

</body>
</html>
